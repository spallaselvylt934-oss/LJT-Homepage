# Temporary workflow to verify the Jekyll site builds correctly.
name: Build test (temporary)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify generated pages
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          echo "--- All six publication titles on the About/home page:"
          for t in "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" "On the Perception Bottleneck of VLMs for Chart Understanding" "On the Universal Truthfulness Hyperplane Inside LLMs" "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" "Composing Parameter-Efficient Modules with Arithmetic Operations"; do
            grep -o "$t" _site/index.html | head -1
          done
          echo "--- Key profile details on the About/home page:"
          grep -o "jliugi@connect.ust.hk" _site/index.html | head -1
          grep -o "https://github.com/Vicent0205" _site/index.html | head -1
          grep -o "junteng88716710" _site/index.html | head -1
          grep -o "Zhiyuan Honor Scholarship" _site/index.html | head -1
          grep -o "HKUST NLP Group" _site/index.html | head -1
          grep -o "Shanghai Jiao Tong University" _site/index.html | head -1
          grep -o "MINIMAX" _site/index.html | head -1
          grep -o "Tencent WXG" _site/index.html | head -1
          grep -o "Shanghai AI Lab" _site/index.html | head -1
          grep -o "Junxian He" _site/index.html | head -1
          echo "--- Publications subpage item count (expect 6):"
          grep -o 'archive__item-title' _site/publications/index.html | wc -l
          test "$(grep -o 'archive__item-title' _site/publications/index.html | wc -l)" -eq 6
          grep -o "Preprints" _site/publications/index.html | head -1
          grep -o "Conference Papers" _site/publications/index.html | head -1
          echo "--- All six individual publication pages:"
          ls _site/publication
